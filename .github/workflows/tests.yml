name: tests

on:
  push:
  pull_request:

jobs:
  data-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Los tests validan los JSON ya versionados en data/ — no usan la red.
      - run: python -m pytest tests/ -v
